name: Publish to npm

# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Each package must have a Trusted Publisher configured on npmjs.com pointing at
# this repo + workflow file (publish.yml). npm auto-detects the OIDC environment
# and authenticates without a token; provenance attestations are generated
# automatically for these public packages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'   # >= 22.14.0 required for OIDC
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Ensure npm supports OIDC (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Engine publishes first so the CLI's dependency resolves on npm.
      - name: Publish engine (if new version)
        shell: bash
        run: |
          name="$(node -p "require('./packages/engine/package.json').name")"
          version="$(node -p "require('./packages/engine/package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on npm; skipping."
          else
            npm publish -w "${name}"
          fi

      - name: Publish CLI (if new version)
        shell: bash
        run: |
          name="$(node -p "require('./packages/cli/package.json').name")"
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on npm; skipping."
          else
            npm publish -w "${name}"
          fi
